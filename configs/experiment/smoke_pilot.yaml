# End-to-end smoke test config: same code path as h1_pilot.yaml, tiny data, separate output
# directories so a smoke run can never contaminate the real pilot results.
seed: 0

repo_root: .
paths:
  data_dir: smoke/data
  graph_dir: smoke/graphs
  block_dir: smoke/blocks
  cache_dir: smoke/caches
  results_dir: smoke/results
  reports_dir: smoke/reports

model:
  path: /root/autodl-tmp/models/Qwen2.5-0.5B-Instruct
  device: auto
  dtype: auto
  use_chat_template: true

data:
  per_template: 3
  family_overrides: {}
  dedup_near_threshold: 0.9

graph:
  k: 8
  region_column: superclass
  region_prefix: cb_
  status_column: statusLabel
  excluded_status: [Glia, Out of scope]
  community_column: supertype
  module_column: superclass
  min_community_size: 1
  edge_transform: log1p
  steps: 2

nulls:
  seed: 0
  instances: 1
  kinds: [no_neighbor, degree_preserving]

blocks:
  rank: 4
  scale: 1.0
  lr: 2.0e-3
  epochs: 1
  batch_size: 4
  max_length: 128
  seed: 0

cache:
  max_new_tokens: 8
  batch_size: 32
  do_sample: false

router:
  steps: 2
  temperature: 1.0
  hidden: 32
  dropout: 0.0
  use_node_features: false
  train:
    epochs: 8
    batch_size: 32
    lr: 3.0e-3
    weight_decay: 1.0e-4
    early_stopping_patience: 5
  loss:
    class_weights: {FIX: 1.0, BREAK: 2.0, UNCHANGED: 1.0}
  selection:
    lambda_break: 1.0
    gamma_cost: 0.0
  seeds: [0]

evaluation:
  coverages: [0.10, 0.20]
  primary_coverage: 0.10
  bootstrap: 50
  calibration_protocol: max_net_repair
